name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          printf '%s' "$PR_BODY_JSON" | jq -r '.' > /tmp/pr_body.md
          test -s /tmp/pr_body.md
          grep -q '^#### Context$' /tmp/pr_body.md
          grep -q '^#### TL;DR$' /tmp/pr_body.md
          grep -q '^#### Summary$' /tmp/pr_body.md
          grep -q '^#### Alternatives$' /tmp/pr_body.md
          grep -q '^#### Test Plan$' /tmp/pr_body.md
          if grep -q '<!--' /tmp/pr_body.md; then
            echo "Remove placeholder comments from the PR description." >&2
            exit 1
          fi
