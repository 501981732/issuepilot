<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">IssuePilot V4.10 手绘教育信息图：当前架构</title>
  <desc id="desc">用中文手绘风格说明 IssuePilot V4.10 如何把 GitLab Issue、V2 本地运行时、V4 智能层、Runner Adapter、Dashboard 和本地状态连接起来。</desc>
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 38px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #111827; }
      .subtitle { font: 18px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #475569; }
      .section { font: 700 23px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #111827; }
      .label { font: 18px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #111827; }
      .small { font: 15px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #475569; }
      .tiny { font: 13px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #64748b; }
      .box { stroke: #1f2937; stroke-width: 2.4; fill: #ffffff; }
      .box2 { stroke: #1f2937; stroke-width: 1.7; fill: none; opacity: 0.55; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-muted); }
      .note { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .runtime { fill: #dcfce7; }
      .intel { fill: #ede9fe; }
      .runner { fill: #fef3c7; }
      .ui { fill: #fce7f3; }
      .store { fill: #f1f5f9; }
      .external { fill: #e0f2fe; }
      .config { fill: #e0e7ff; }
      .chip { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="960"/>
  <g filter="url(#paper)">
    <text x="64" y="72" class="title">IssuePilot V4.10 当前架构：一张手绘图看懂</text>
    <text x="66" y="108" class="subtitle">核心思想：V2 本地运行时负责“安全执行”，V4 智能层负责“拆解、协作、证据、复盘”。</text>

    <rect x="55" y="142" width="250" height="255" rx="24" class="box external"/>
    <rect x="60" y="147" width="250" height="255" rx="24" class="box2"/>
    <text x="82" y="184" class="section">外部世界</text>
    <text x="84" y="226" class="label">GitLab Issue</text>
    <text x="84" y="255" class="small">labels / MR / CI / comments</text>
    <text x="84" y="303" class="label">Operator</text>
    <text x="84" y="332" class="small">确认计划、处理返工</text>
    <text x="84" y="370" class="label">Human reviewer</text>

    <rect x="55" y="445" width="250" height="165" rx="24" class="box config"/>
    <rect x="61" y="451" width="250" height="165" rx="24" class="box2"/>
    <text x="82" y="487" class="section">配置入口</text>
    <text x="84" y="527" class="label">WORKFLOW.md</text>
    <text x="84" y="555" class="small">roles / runners / tracker</text>
    <text x="84" y="589" class="label">issuepilot.team.yaml</text>

    <rect x="360" y="145" width="330" height="465" rx="28" class="box runtime"/>
    <rect x="366" y="151" width="330" height="465" rx="28" class="box2"/>
    <text x="390" y="185" class="section">V2 本地运行时</text>
    <text x="392" y="218" class="small">负责可靠执行，不提前平台化</text>
    <rect x="392" y="247" width="250" height="48" rx="14" class="chip"/>
    <text x="414" y="278" class="label">Fastify API</text>
    <rect x="392" y="314" width="250" height="48" rx="14" class="chip"/>
    <text x="414" y="345" class="label">调度器 + lease</text>
    <rect x="392" y="381" width="250" height="48" rx="14" class="chip"/>
    <text x="414" y="412" class="label">claim / dispatch / cleanup</text>
    <rect x="392" y="448" width="250" height="48" rx="14" class="chip"/>
    <text x="414" y="479" class="label">tracker-gitlab adapter</text>
    <rect x="392" y="515" width="250" height="48" rx="14" class="chip"/>
    <text x="414" y="546" class="label">workspace adapter</text>

    <rect x="760" y="118" width="385" height="540" rx="32" class="box intel"/>
    <rect x="766" y="124" width="385" height="540" rx="32" class="box2"/>
    <text x="794" y="160" class="section">V4 智能层</text>
    <text x="796" y="192" class="small">围绕 WorkItem 组织多个 run</text>
    <rect x="796" y="222" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="251" class="label">WorkItem：父 Issue 状态</text>
    <rect x="796" y="282" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="311" class="label">TaskGraph：依赖和队列</text>
    <rect x="796" y="342" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="371" class="label">多 Agent Pipeline</text>
    <text x="818" y="398" class="tiny">coder / reviewer / test_evidence</text>
    <rect x="796" y="426" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="455" class="label">Parent Review Packet</text>
    <rect x="796" y="486" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="515" class="label">Quality Analytics</text>
    <rect x="796" y="546" width="284" height="45" rx="14" class="chip"/>
    <text x="818" y="575" class="label">ReviewReworkPlan</text>
    <text x="818" y="619" class="small">把评论变成下一轮返工输入</text>

    <rect x="1215" y="145" width="300" height="225" rx="28" class="box runner"/>
    <rect x="1221" y="151" width="300" height="225" rx="28" class="box2"/>
    <text x="1242" y="185" class="section">Runner Adapter</text>
    <text x="1244" y="226" class="label">RunnerRegistry</text>
    <text x="1244" y="255" class="small">kind / capability / role binding</text>
    <text x="1244" y="304" class="label">codex_app_server</text>
    <text x="1244" y="333" class="small">默认 runner</text>
    <text x="1388" y="304" class="label">claude_code</text>
    <text x="1388" y="333" class="small">reviewer opt-in</text>

    <rect x="1215" y="426" width="300" height="235" rx="28" class="box ui"/>
    <rect x="1221" y="432" width="300" height="235" rx="28" class="box2"/>
    <text x="1242" y="466" class="section">Dashboard</text>
    <text x="1244" y="506" class="label">Command Center</text>
    <text x="1244" y="537" class="label">Work Items / TaskGraph</text>
    <text x="1244" y="568" class="label">Run Detail</text>
    <text x="1244" y="599" class="label">Review Packet</text>
    <text x="1244" y="630" class="label">Reports</text>

    <rect x="360" y="705" width="785" height="142" rx="28" class="box store"/>
    <rect x="366" y="711" width="785" height="142" rx="28" class="box2"/>
    <text x="392" y="747" class="section">~/.issuepilot 本地状态</text>
    <text x="394" y="790" class="label">repos / workspaces / events / work-items / reports / recommendations / credentials</text>
    <text x="394" y="824" class="small">local-first：保留证据、日志和 workspace，方便排障与复盘</text>

    <rect x="1215" y="724" width="300" height="123" rx="24" class="note"/>
    <text x="1241" y="762" class="section">V4.10 边界</text>
    <text x="1243" y="801" class="small">single daemon 已锁定；team daemon 的</text>
    <text x="1243" y="826" class="small">review workflow binding 是 follow-up。</text>

    <path d="M305 260 C330 255,335 250,360 260" class="arrow"/>
    <path d="M305 525 C330 520,335 500,360 500" class="arrow"/>
    <path d="M690 375 C720 360,730 355,760 370" class="arrow"/>
    <path d="M1145 300 C1170 290,1190 285,1215 290" class="arrow"/>
    <path d="M1145 520 C1170 530,1190 535,1215 535" class="arrow"/>
    <path d="M975 658 C970 690,900 710,840 724" class="arrow"/>
    <path d="M1215 790 C1180 780,1170 765,1145 745" class="dash"/>
  </g>
</svg>
