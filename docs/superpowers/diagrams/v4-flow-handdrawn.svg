<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">IssuePilot V4.10 手绘教育信息图：端到端流程</title>
  <desc id="desc">用中文手绘风格说明一个 GitLab Issue 如何经过 ai-ready、WorkItem 计划、多 Agent 执行、Review Packet、人工 review 和 ReviewReworkPlan 形成闭环。</desc>
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 38px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #111827; }
      .subtitle { font: 18px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #475569; }
      .num { font: 700 24px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #ffffff; }
      .label { font: 20px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #111827; }
      .small { font: 15px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #475569; }
      .tiny { font: 13px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #64748b; }
      .box { stroke: #1f2937; stroke-width: 2.4; fill: #ffffff; }
      .box2 { stroke: #1f2937; stroke-width: 1.6; fill: none; opacity: 0.55; }
      .circle { fill: #111827; stroke: #111827; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { stroke: #7c3aed; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-dasharray: 9 6; marker-end: url(#arrow-purple); }
      .issue { fill: #e0f2fe; }
      .plan { fill: #ede9fe; }
      .run { fill: #dcfce7; }
      .review { fill: #fce7f3; }
      .report { fill: #fef3c7; }
      .done { fill: #f1f5f9; }
      .warn { fill: #fee2e2; stroke: #b91c1c; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#334155" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <g filter="url(#paper)">
    <text x="64" y="72" class="title">IssuePilot V4.10 端到端流程：从 Issue 到可审查交付</text>
    <text x="66" y="108" class="subtitle">这张图给新读者看“发生了什么”，精确 API 和状态细节仍以 spec / Mermaid 图为准。</text>

    <rect x="70" y="160" width="245" height="145" rx="25" class="box issue"/>
    <rect x="76" y="166" width="245" height="145" rx="25" class="box2"/>
    <circle cx="112" cy="203" r="23" class="circle"/><text x="105" y="212" class="num">1</text>
    <text x="145" y="199" class="label">GitLab Issue</text>
    <text x="145" y="230" class="small">打上 `ai-ready`</text>
    <text x="145" y="259" class="small">进入可执行队列</text>

    <rect x="400" y="145" width="270" height="175" rx="25" class="box plan"/>
    <rect x="406" y="151" width="270" height="175" rx="25" class="box2"/>
    <circle cx="443" cy="193" r="23" class="circle"/><text x="436" y="202" class="num">2</text>
    <text x="476" y="190" class="label">生成 WorkItem</text>
    <text x="476" y="223" class="small">拆成 TaskPlan</text>
    <text x="476" y="251" class="small">标记依赖和风险</text>
    <text x="476" y="279" class="tiny">Operator 可编辑 / 重排</text>

    <rect x="755" y="145" width="270" height="175" rx="25" class="box plan"/>
    <rect x="761" y="151" width="270" height="175" rx="25" class="box2"/>
    <circle cx="798" cy="193" r="23" class="circle"/><text x="791" y="202" class="num">3</text>
    <text x="831" y="190" class="label">TaskGraph 排队</text>
    <text x="831" y="223" class="small">只跑已解锁任务</text>
    <text x="831" y="251" class="small">阻塞任务等待上游</text>
    <text x="831" y="279" class="tiny">blocked_by_dependency</text>

    <rect x="1110" y="145" width="310" height="175" rx="25" class="box run"/>
    <rect x="1116" y="151" width="310" height="175" rx="25" class="box2"/>
    <circle cx="1153" cy="193" r="23" class="circle"/><text x="1146" y="202" class="num">4</text>
    <text x="1186" y="190" class="label">隔离执行</text>
    <text x="1186" y="223" class="small">创建 worktree，label = ai-running</text>
    <text x="1186" y="251" class="small">runner 只在当前任务目录内工作</text>

    <rect x="143" y="430" width="315" height="205" rx="28" class="box run"/>
    <rect x="149" y="436" width="315" height="205" rx="28" class="box2"/>
    <circle cx="188" cy="481" r="23" class="circle"/><text x="181" y="490" class="num">5</text>
    <text x="221" y="477" class="label">多 Agent Pipeline</text>
    <text x="221" y="512" class="small">coder：实现</text>
    <text x="221" y="541" class="small">reviewer：审查</text>
    <text x="221" y="570" class="small">test_evidence：验证和证据</text>
    <text x="221" y="600" class="tiny">codex_app_server 默认；claude_code 可 opt-in</text>

    <rect x="560" y="430" width="310" height="205" rx="28" class="box report"/>
    <rect x="566" y="436" width="310" height="205" rx="28" class="box2"/>
    <circle cx="606" cy="481" r="23" class="circle"/><text x="599" y="490" class="num">6</text>
    <text x="639" y="477" class="label">沉淀证据</text>
    <text x="639" y="512" class="small">AgentReport</text>
    <text x="639" y="541" class="small">Evidence：日志 / 截图 / 测试</text>
    <text x="639" y="570" class="small">runner trace + redaction trace</text>

    <rect x="970" y="430" width="320" height="205" rx="28" class="box review"/>
    <rect x="976" y="436" width="320" height="205" rx="28" class="box2"/>
    <circle cx="1016" cy="481" r="23" class="circle"/><text x="1009" y="490" class="num">7</text>
    <text x="1049" y="477" class="label">Review Packet</text>
    <text x="1049" y="512" class="small">汇总所有子任务结果</text>
    <text x="1049" y="541" class="small">风险、验证、MR、下一步</text>
    <text x="1049" y="570" class="small">label = human-review</text>

    <rect x="132" y="760" width="300" height="155" rx="25" class="box review"/>
    <rect x="138" y="766" width="300" height="155" rx="25" class="box2"/>
    <circle cx="178" cy="808" r="23" class="circle"/><text x="171" y="817" class="num">8</text>
    <text x="211" y="804" class="label">人工 Review</text>
    <text x="211" y="837" class="small">merge：关闭 Issue</text>
    <text x="211" y="865" class="small">comments：进入返工计划</text>

    <rect x="540" y="760" width="330" height="155" rx="25" class="box plan"/>
    <rect x="546" y="766" width="330" height="155" rx="25" class="box2"/>
    <circle cx="586" cy="808" r="23" class="circle"/><text x="579" y="817" class="num">9</text>
    <text x="619" y="804" class="label">ReviewReworkPlan</text>
    <text x="619" y="837" class="small">把评论分类、定位 source refs</text>
    <text x="619" y="865" class="small">Operator accept 后注入下一轮</text>

    <rect x="987" y="760" width="300" height="155" rx="25" class="box done"/>
    <rect x="993" y="766" width="300" height="155" rx="25" class="box2"/>
    <circle cx="1033" cy="808" r="23" class="circle"/><text x="1022" y="817" class="num">10</text>
    <text x="1066" y="804" class="label">复盘和改进</text>
    <text x="1066" y="837" class="small">Quality Analytics</text>
    <text x="1066" y="865" class="small">Improvement Recommendations</text>

    <rect x="1328" y="746" width="210" height="183" rx="24" class="box warn"/>
    <text x="1352" y="788" class="label">V4.10 边界</text>
    <text x="1352" y="824" class="small">single daemon 已锁定</text>
    <text x="1352" y="852" class="small">team review workflow</text>
    <text x="1352" y="880" class="small">binding 是 follow-up</text>

    <path d="M315 230 C350 220,365 220,400 224" class="arrow"/>
    <path d="M670 232 C705 220,720 220,755 228" class="arrow"/>
    <path d="M1025 232 C1060 220,1075 220,1110 226" class="arrow"/>
    <path d="M1250 320 C1170 390,620 355,303 430" class="arrow"/>
    <path d="M458 534 C500 520,520 520,560 526" class="arrow"/>
    <path d="M870 532 C915 520,930 520,970 526" class="arrow"/>
    <path d="M1130 635 C950 720,520 715,282 760" class="arrow"/>
    <path d="M432 839 C470 830,500 825,540 828" class="arrow"/>
    <path d="M870 838 C910 830,945 825,987 830" class="arrow"/>
    <path d="M705 760 C685 700,560 665,420 620" class="loop"/>
    <path d="M1287 840 C1305 835,1315 835,1328 835" class="arrow"/>

    <text x="620" y="690" class="small">返工闭环：accepted plan → 下一轮 `ai-rework` prompt</text>
  </g>
</svg>
